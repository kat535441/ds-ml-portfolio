name: Train Entity Similarity Model

on:
  workflow_dispatch

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -f 1_entity_similarity_analytics/Dockerfile.train -t entity-similarity-train 1_entity_similarity_analytics/
      
      - name: Run training
        run: >
          docker run
          -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          -e S3_ENDPOINT_URL=${{ secrets.S3_ENDPOINT_URL }}
          -e S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          entity-similarity-train