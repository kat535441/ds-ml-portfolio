[project]
name = "car-offer-rec"
version = "0.1.0"
description = "Car Offer Recommendation System for Carsharing Service"
requires-python = ">=3.12"
dependencies = [
    "ml-common",
    "fastapi>=0.117.1",
    "uvicorn>=0.37.0",
    "pydantic>=2.11.9",
    "pandas>=2.2.3",
    "numpy>=2.3.1",
    "duckdb>=1.3.2",
    "catboost>=1.2.8",
    "scikit-learn>=1.8.0",
    "scipy>=1.15.2",
    "h3>=4.2.2",
    "geopy>=2.4.1",
    "joblib>=1.4.2",
]

[project.optional-dependencies]
train = [
    "implicit>=0.7.0",
    "clearml>=2.0.2",
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
]